<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mekân İsmi Seçici</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14110f; --bg2:#1c1714; --card:#221c18; --card2:#2a221d;
  --line:#3a2f27; --ink:#f3ece2; --muted:#a89580; --faint:#6f5f4f;
  --gold:#e0b170; --gold-soft:#c79a5a; --green:#7fb685; --green-bg:#1e2f22;
  --red:#d98873; --red-bg:#2f1f1c; --shadow:0 18px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Manrope',sans-serif;background:var(--bg);color:var(--ink);
  overscroll-behavior:none;
  background-image:radial-gradient(120% 80% at 50% -10%, #2a211b 0%, var(--bg) 55%);
}
.serif{font-family:'Fraunces',serif}

/* ---- HEADER ---- */
header{
  position:sticky;top:0;z-index:50;padding:14px 18px 12px;
  padding-top:max(14px,env(safe-area-inset-top));
  background:rgba(20,17,15,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.h-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-family:'Fraunces',serif;font-size:1.12rem;font-weight:600}
.moon{width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 32% 32%, #f6e4c0, var(--gold) 70%);
  box-shadow:0 0 14px rgba(224,177,112,.55)}
.counts{display:flex;gap:6px;font-size:.72rem;font-weight:600}
.pill{padding:4px 9px;border-radius:20px;border:1px solid var(--line)}
.pill.lk{color:var(--green);border-color:#334a37}
.pill.dk{color:var(--red);border-color:#4a302a}

/* ---- MODE SWITCH ---- */
.modes{display:flex;gap:6px;margin-top:12px;background:var(--bg2);padding:4px;border-radius:13px;border:1px solid var(--line)}
.mode{flex:1;padding:9px;border:none;background:transparent;color:var(--muted);
  font-family:'Manrope';font-weight:700;font-size:.84rem;border-radius:10px;cursor:pointer;transition:.25s}
.mode.on{background:linear-gradient(180deg,var(--card2),var(--card));color:var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.4)}

.wrap{max-width:560px;margin:0 auto}

/* ---- SWIPE VIEW ---- */
#swipe{padding:18px 18px 0}
.prog{height:5px;background:var(--bg2);border-radius:10px;overflow:hidden;margin-bottom:6px}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-soft),var(--gold));transition:width .3s}
.prog-txt{font-size:.72rem;color:var(--faint);text-align:center;margin-bottom:14px;letter-spacing:.3px}
.deck{position:relative;height:clamp(380px,62vh,520px)}
.swipe-card{
  position:absolute;inset:0;background:linear-gradient(165deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
  padding:30px 26px;display:flex;flex-direction:column;justify-content:center;
  touch-action:pan-y;cursor:grab;will-change:transform;
}
.swipe-card .cat-tag{position:absolute;top:20px;left:24px;right:24px;
  font-size:.7rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.swipe-card .nm{font-family:'Fraunces',serif;font-weight:600;font-size:2.5rem;line-height:1.05;color:var(--ink);margin-bottom:14px}
.swipe-card .pr{font-size:1.05rem;color:var(--gold);font-style:italic;font-family:'Fraunces',serif;margin-bottom:18px}
.swipe-card .pr::before{content:'◞ '}
.swipe-card .ds{font-size:1rem;line-height:1.6;color:var(--muted)}
.stamp{position:absolute;top:26px;font-family:'Fraunces',serif;font-weight:700;font-size:1.6rem;
  padding:5px 16px;border-radius:12px;border:3px solid;opacity:0;transform:rotate(-12deg);transition:opacity .1s}
.stamp.yes{right:24px;color:var(--green);border-color:var(--green);transform:rotate(12deg)}
.stamp.no{left:24px;color:var(--red);border-color:var(--red)}
.deck-done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px}
.deck-done .serif{font-size:1.8rem}
.deck-done p{color:var(--muted);font-size:.95rem;line-height:1.5}
.mini-btn{margin-top:6px;padding:11px 22px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--gold);font-weight:700;font-family:'Manrope';cursor:pointer}

.swipe-actions{display:flex;gap:14px;justify-content:center;align-items:center;padding:20px 0 14px}
.sb{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.sb:active{transform:scale(.9)}
.sb.no{color:var(--red)}.sb.no:active{background:var(--red-bg)}
.sb.yes{color:var(--green)}.sb.yes:active{background:var(--green-bg)}
.sb.undo{width:50px;height:50px;font-size:1.05rem;color:var(--muted)}
.sb.fav{width:50px;height:50px;font-size:1.15rem;color:var(--gold)}
.hint{text-align:center;font-size:.74rem;color:var(--faint);padding-bottom:16px}

/* ---- LIST VIEW ---- */
#list{padding:14px 16px 30px;display:none}
.lfilter{display:flex;gap:7px;margin-bottom:14px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.lfilter::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 15px;border-radius:22px;border:1px solid var(--line);background:var(--bg2);
  color:var(--muted);font-weight:600;font-size:.82rem;white-space:nowrap;cursor:pointer;transition:.2s}
.chip.on{background:var(--gold);color:#1a140d;border-color:var(--gold)}
.acc{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:11px;overflow:hidden}
.acc-h{padding:15px 17px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;font-family:'Fraunces',serif;font-weight:600;font-size:1.02rem}
.acc-h .ct{font-size:.74rem;color:var(--faint);font-family:'Manrope';font-weight:600;background:var(--bg2);padding:2px 9px;border-radius:12px}
.acc-h .arr{margin-left:10px;color:var(--faint);transition:.3s;font-size:.7rem}
.acc.open .arr{transform:rotate(180deg)}
.acc-b{display:none;padding:4px 11px 11px;border-top:1px solid var(--line)}
.acc.open .acc-b{display:block}
.row{display:flex;align-items:center;gap:11px;padding:12px 7px;border-bottom:1px solid rgba(58,47,39,.5);transition:.25s}
.row:last-child{border-bottom:none}
.row.liked{background:linear-gradient(90deg,rgba(127,182,133,.09),transparent)}
.row.disliked{opacity:.4}
.row.disliked .r-nm{text-decoration:line-through}
.r-info{flex:1;min-width:0}
.r-nm{font-family:'Fraunces',serif;font-weight:600;font-size:1.12rem;color:var(--ink)}
.r-pr{font-size:.8rem;color:var(--gold);font-style:italic}
.r-ds{font-size:.8rem;color:var(--muted);margin-top:3px;line-height:1.4}
.r-acts{display:flex;gap:7px;flex:0 0 auto}
.rb{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);
  font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.rb.no.on{background:var(--red);border-color:var(--red)}
.rb.yes.on{background:var(--green);border-color:var(--green)}
.empty{text-align:center;color:var(--faint);padding:50px 20px;font-size:.95rem}
.empty .serif{display:block;font-size:1.3rem;color:var(--muted);margin-bottom:8px}

/* ---- SHARE BAR ---- */
.sharebar{position:sticky;bottom:0;z-index:40;padding:12px 16px;
  padding-bottom:max(12px,env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,var(--bg) 30%);display:flex;gap:9px;max-width:560px;margin:0 auto}
.share{flex:1;padding:15px;border-radius:14px;border:none;font-family:'Manrope';font-weight:700;font-size:.92rem;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.share.wa{background:#1f3d2e;color:#7fd6a0;border:1px solid #2c5440}
.share.cp{background:var(--card2);color:var(--gold);border:1px solid var(--line)}
.share:active{transform:scale(.97)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
  background:var(--gold);color:#1a140d;padding:12px 22px;border-radius:30px;font-weight:700;font-size:.88rem;
  opacity:0;pointer-events:none;transition:.3s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="h-top">
      <div class="brand"><span class="moon"></span>Mekân İsmi Seçici</div>
      <div class="counts">
        <span class="pill lk">♥ <span id="cLike">0</span></span>
        <span class="pill dk">✕ <span id="cDis">0</span></span>
      </div>
    </div>
    <div class="modes">
      <button class="mode on" id="mSwipe" onclick="setMode('swipe')">⚡ Hızlı Tara</button>
      <button class="mode" id="mList" onclick="setMode('list')">☰ Liste & Ele</button>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- SWIPE -->
  <section id="swipe">
    <div class="prog"><i id="progBar"></i></div>
    <div class="prog-txt" id="progTxt"></div>
    <div class="deck" id="deck"></div>
    <div class="swipe-actions">
      <button class="sb undo" onclick="undo()" title="Geri al">↶</button>
      <button class="sb no" onclick="swipeBtn('dislike')" title="Elendi">✕</button>
      <button class="sb fav" onclick="swipeBtn('skip')" title="Pas geç">⤳</button>
      <button class="sb yes" onclick="swipeBtn('like')" title="Beğendim">♥</button>
    </div>
    <div class="hint">Sağa kaydır → beğen · Sola kaydır → ele · ⤳ pas geç</div>
  </section>

  <!-- LIST -->
  <section id="list">
    <div class="lfilter" id="lfilter">
      <button class="chip on" onclick="setFilter('all',this)">Tümü</button>
      <button class="chip" onclick="setFilter('liked',this)">♥ Beğendiklerim</button>
      <button class="chip" onclick="setFilter('disliked',this)">✕ Elediklerim</button>
      <button class="chip" onclick="setFilter('undecided',this)">○ Kararsız</button>
    </div>
    <div id="accs"></div>
  </section>

</div>

<div class="sharebar">
  <button class="share wa" onclick="shareWA()">↗ WhatsApp'ta Paylaş</button>
  <button class="share cp" onclick="copyList()">⧉ Kopyala</button>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- STATE ---------- */
// her isme benzersiz id ver
let ID=0; const FLAT=[];
DATA.forEach((c,ci)=>c.items.forEach(it=>{it.id='n'+(ID++);it.cat=c.cat;it.ci=ci;FLAT.push(it);}));
const TOTAL=FLAT.length;

let votes={};
try{votes=JSON.parse(localStorage.getItem('cafeVotes_v2'))||{};}catch(e){votes={};}
function save(){try{localStorage.setItem('cafeVotes_v2',JSON.stringify(votes));}catch(e){}}

function counts(){
  let l=0,d=0; for(const k in votes){if(votes[k]==='like')l++;else if(votes[k]==='dislike')d++;}
  return {l,d};
}
function refreshCounts(){
  const c=counts();
  document.getElementById('cLike').textContent=c.l;
  document.getElementById('cDis').textContent=c.d;
}

/* ---------- MODE ---------- */
let mode='swipe';
function setMode(m){
  mode=m;
  document.getElementById('swipe').style.display = m==='swipe'?'block':'none';
  document.getElementById('list').style.display  = m==='list' ?'block':'none';
  document.getElementById('mSwipe').classList.toggle('on',m==='swipe');
  document.getElementById('mList').classList.toggle('on',m==='list');
  if(m==='swipe')buildDeck();
  if(m==='list')renderList();
}

/* ---------- SWIPE DECK ---------- */
let queue=[];        // henüz oylanmamış id'ler
let history=[];      // {id,vote} geri-al için
function rebuildQueue(){ queue=FLAT.filter(it=>!votes[it.id]).map(it=>it.id); }

function buildDeck(){
  rebuildQueue();
  const deck=document.getElementById('deck');
  deck.innerHTML='';
  if(queue.length===0){ showDone(); updateProg(); return; }
  // en üstteki 2 kartı göster (derinlik hissi)
  const top=queue.slice(0,2).reverse();
  top.forEach((id,i)=>{
    const it=FLAT.find(x=>x.id===id);
    const isTop = (i===top.length-1);
    const card=document.createElement('div');
    card.className='swipe-card';
    card.dataset.id=id;
    card.style.transform = isTop?'scale(1)':'scale(.94) translateY(14px)';
    card.style.opacity = isTop?'1':'.6';
    card.style.zIndex = i;
    card.innerHTML=`
      <div class="cat-tag">${it.cat}</div>
      <div class="stamp yes">BEĞEN</div>
      <div class="stamp no">ELE</div>
      <div class="nm">${it.n}</div>
      <div class="pr">${it.p}</div>
      <div class="ds">${it.d}</div>`;
    deck.appendChild(card);
    if(isTop) attachDrag(card);
  });
  updateProg();
}
function showDone(){
  const c=counts();
  document.getElementById('deck').innerHTML=`
    <div class="deck-done">
      <div class="serif">Tarama bitti ✦</div>
      <p>${c.l} isim beğendin, ${c.d} isim eledin.<br>Şimdi <b style="color:var(--gold)">Liste & Ele</b> sekmesinden beğendiklerini ince eleyebilirsin.</p>
      <button class="mini-btn" onclick="setMode('list');setFilter('liked',document.querySelectorAll('.chip')[1])">♥ Beğendiklerime Geç</button>
      <button class="mini-btn" style="color:var(--muted)" onclick="resetAll()">↺ Baştan Başla</button>
    </div>`;
}
function updateProg(){
  const done=TOTAL-queue.length;
  document.getElementById('progBar').style.width=(done/TOTAL*100)+'%';
  document.getElementById('progTxt').textContent=
    queue.length>0 ? `${done} / ${TOTAL} değerlendirildi · ${queue.length} kaldı` : `${TOTAL} / ${TOTAL} tamamlandı`;
}

/* drag/swipe */
function attachDrag(card){
  let sx=0,sy=0,dx=0,dy=0,drag=false;
  const yes=card.querySelector('.stamp.yes'), no=card.querySelector('.stamp.no');
  const start=(x,y)=>{sx=x;sy=y;drag=true;card.style.transition='none';};
  const move=(x,y)=>{
    if(!drag)return; dx=x-sx;dy=y-sy;
    const rot=dx/18;
    card.style.transform=`translate(${dx}px,${dy}px) rotate(${rot}deg)`;
    yes.style.opacity=dx>30?Math.min(dx/120,1):0;
    no.style.opacity =dx<-30?Math.min(-dx/120,1):0;
  };
  const end=()=>{
    if(!drag)return; drag=false;
    card.style.transition='transform .35s ease, opacity .35s';
    if(dx>95){ fly(card,1,'like'); }
    else if(dx<-95){ fly(card,-1,'dislike'); }
    else{ card.style.transform='scale(1)'; yes.style.opacity=0; no.style.opacity=0; }
    dx=dy=0;
  };
  card.addEventListener('touchstart',e=>start(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
  card.addEventListener('touchmove', e=>move(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
  card.addEventListener('touchend', end);
  card.addEventListener('mousedown',e=>{start(e.clientX,e.clientY);
    const mm=ev=>move(ev.clientX,ev.clientY), mu=()=>{end();document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);};
    document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);});
}
function fly(card,dir,vote){
  const id=card.dataset.id;
  card.style.transform=`translate(${dir*window.innerWidth}px,40px) rotate(${dir*25}deg)`;
  card.style.opacity='0';
  setTimeout(()=>{ commitVote(id,vote); buildDeck(); },230);
}
function commitVote(id,vote){
  votes[id]=vote; history.push({id,vote}); save(); refreshCounts();
}

function swipeBtn(kind){
  if(queue.length===0)return;
  const id=queue[0];
  const card=document.querySelector(`.swipe-card[data-id="${id}"]`);
  if(kind==='skip'){ // pas: sona at, oy verme
    queue.push(queue.shift());
    if(card){card.style.transition='transform .3s, opacity .3s';card.style.transform='translateY(-40px) scale(.9)';card.style.opacity='0';}
    setTimeout(buildDeck,160); return;
  }
  if(card){ fly(card, kind==='like'?1:-1, kind); }
  else { commitVote(id,kind); buildDeck(); }
}
function undo(){
  if(history.length===0){toast('Geri alınacak işlem yok');return;}
  const last=history.pop();
  delete votes[last.id]; save(); refreshCounts(); buildDeck();
}
function resetAll(){
  if(!confirm('Tüm oylar silinsin ve baştan başlasın mı?'))return;
  votes={};history=[];save();refreshCounts();buildDeck();
}

/* ---------- LIST VIEW ---------- */
let filter='all';
let openCats=new Set();
function setFilter(f,el){
  filter=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  if(el)el.classList.add('on');
  renderList();
}
function match(it){
  if(filter==='all')return true;
  if(filter==='liked')return votes[it.id]==='like';
  if(filter==='disliked')return votes[it.id]==='dislike';
  if(filter==='undecided')return !votes[it.id];
}
function renderList(){
  const wrap=document.getElementById('accs');
  wrap.innerHTML='';
  let any=false;
  // filtre uygulanınca ilgili kategorileri otomatik aç
  const autoOpen = filter!=='all';
  DATA.forEach((cat,ci)=>{
    const items=cat.items.filter(match);
    if(items.length===0)return;
    any=true;
    const open = autoOpen || openCats.has(ci);
    const acc=document.createElement('div');
    acc.className='acc'+(open?' open':'');
    acc.innerHTML=`
      <div class="acc-h" onclick="toggleAcc(${ci},this)">
        <span>${cat.cat}</span>
        <span style="display:flex;align-items:center"><span class="ct">${items.length}</span><span class="arr">▼</span></span>
      </div>
      <div class="acc-b">${items.map(rowHTML).join('')}</div>`;
    wrap.appendChild(acc);
  });
  if(!any){
    wrap.innerHTML=`<div class="empty"><span class="serif">Liste boş</span>${
      filter==='liked'?'Henüz isim beğenmedin. Hızlı Tara’dan başla.':
      filter==='disliked'?'Henüz isim elemedin.':
      'Bu filtrede isim yok.'}</div>`;
  }
}
function rowHTML(it){
  const v=votes[it.id]||'';
  return `<div class="row ${v==='like'?'liked':v==='dislike'?'disliked':''}" id="row_${it.id}">
    <div class="r-info">
      <div class="r-nm">${it.n}</div>
      <div class="r-pr">${it.p}</div>
      <div class="r-ds">${it.d}</div>
    </div>
    <div class="r-acts">
      <button class="rb no ${v==='dislike'?'on':''}" onclick="rowVote('${it.id}','dislike')">✕</button>
      <button class="rb yes ${v==='like'?'on':''}" onclick="rowVote('${it.id}','like')">♥</button>
    </div>
  </div>`;
}
function rowVote(id,vote){
  if(votes[id]===vote){delete votes[id];}else{votes[id]=vote;}
  save();refreshCounts();
  const it=FLAT.find(x=>x.id===id);
  const row=document.getElementById('row_'+id);
  const v=votes[id]||'';
  // sadece bu satırı güncelle (liste kapanmasın)
  row.className='row '+(v==='like'?'liked':v==='dislike'?'disliked':'');
  row.querySelector('.rb.no').classList.toggle('on',v==='dislike');
  row.querySelector('.rb.yes').classList.toggle('on',v==='like');
  // filtreli görünümde artık eşleşmiyorsa yumuşakça gizle
  if(filter!=='all' && !match(it)){
    row.style.transition='opacity .3s,transform .3s,height .3s';
    row.style.opacity='0';row.style.transform='translateX(20px)';
    setTimeout(()=>{row.style.display='none';},300);
  }
}
function toggleAcc(ci,el){
  const acc=el.parentElement;
  acc.classList.toggle('open');
  if(acc.classList.contains('open'))openCats.add(ci);else openCats.delete(ci);
}

/* ---------- SHARE ---------- */
function buildText(){
  const liked=FLAT.filter(it=>votes[it.id]==='like');
  if(liked.length===0)return null;
  let t='☕ Beğendiğim Kafe İsimleri\n\n';
  liked.forEach((it,i)=>{ t+=`${i+1}. ${it.n}  (${it.p})\n`; });
  t+=`\nToplam ${liked.length} isim.`;
  return t;
}
function shareWA(){
  const t=buildText();
  if(!t){toast('Önce birkaç isim beğen 🙂');return;}
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}
function copyList(){
  const t=buildText();
  if(!t){toast('Önce birkaç isim beğen 🙂');return;}
  navigator.clipboard.writeText(t).then(()=>toast('Kopyalandı ✓')).catch(()=>{
    // fallback
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Kopyalandı ✓');}catch(e){toast('Kopyalanamadı');}
    document.body.removeChild(ta);
  });
}
let tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2200);
}

/* ---------- INIT ---------- */
refreshCounts();
buildDeck();
</script>
